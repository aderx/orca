<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--background);
    color: var(--foreground);
    font:
      13px Geist,
      sans-serif;
    letter-spacing: 0.01em;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
  }
  h1 {
    font-size: 18px;
    margin: 0;
  }
  h2 {
    font-size: 16px;
    margin: 0;
  }
  h3 {
    font-size: 13px;
    margin: 16px 0 8px;
  }
  .muted {
    color: var(--muted-foreground);
  }
  .path {
    font: 12px var(--font-mono, monospace);
    overflow-wrap: anywhere;
  }
  .toolbar,
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toolbar {
    justify-content: space-between;
  }
  .panels {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .section {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    overflow: hidden;
  }
  .section > :not(.servers):not(.module-browser) {
    flex-shrink: 0;
  }
  #worktree {
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .module-browser {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 8px;
    margin-top: 12px;
  }
  .alphabet {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
    gap: 2px;
    scrollbar-width: thin;
  }
  .alphabet button {
    padding: 1px 5px;
    min-width: 24px;
    font-size: 11px;
    border-color: transparent;
  }
  .alphabet button[aria-pressed='true'] {
    background: var(--accent);
  }
  .service-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 100px;
  }
  .service-toggle .loading {
    animation: service-spin 1s linear infinite;
  }
  .service-toggle .service-stop-icon,
  .service-toggle .service-stop-label { display: none; }
  .service-toggle[data-can-stop='true']:not(:disabled):is(:hover, :focus-visible) .service-state-icon,
  .service-toggle[data-can-stop='true']:not(:disabled):is(:hover, :focus-visible) .service-state-label { display: none; }
  .service-toggle[data-can-stop='true']:not(:disabled):is(:hover, :focus-visible) .service-stop-icon { display: block; }
  .service-toggle[data-can-stop='true']:not(:disabled):is(:hover, :focus-visible) .service-stop-label { display: inline; }
  @keyframes service-spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .service-toggle .loading { animation: none; }
  }
  button svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .module-group {
    margin: 0;
    padding: 8px;
    background: var(--muted);
    color: var(--muted-foreground);
  }
  .module-browser .modules {
    margin: 0;
  }
  .modules.empty,
  .servers.empty {
    display: grid;
    place-items: center;
  }
  .module-message {
    margin: 0;
    padding: 24px;
    text-align: center;
    overflow-wrap: anywhere;
    max-width: 100%;
  }
  .server-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .server-empty p { margin: 0; }
  .alphabet:empty {
    display: none;
  }
  .module-details {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    min-width: 0;
  }
  .product-controls {
    flex-wrap: nowrap;
  }
  .product-controls .search-field {
    flex: 1;
  }
  .search-field {
    position: relative;
    min-width: 0;
    height: 32px;
  }
  .search-field input {
    width: 100%;
    height: 100%;
    padding-right: 32px;
  }
  .search-clear {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    padding: 4px;
    border: 0;
    background: transparent;
    color: var(--muted-foreground);
  }
  .search-clear svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  #product {
    width: 190px;
    max-width: 40%;
    min-width: 0;
    height: 32px;
  }
  .icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    padding: 7px;
  }
  .info {
    max-height: 64px;
    overflow: auto;
  }
  button,
  input,
  textarea,
  select {
    font: inherit;
    border: 1px solid var(--border);
    border-radius: var(--radius-md, 6px);
    background: var(--background);
    color: var(--foreground);
    padding: 7px 10px;
  }
  button {
    cursor: pointer;
  }
  button:hover {
    background: var(--accent);
  }
  button.primary {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }
  button.quiet,
  button.danger-ghost {
    border-color: transparent;
    background: transparent;
  }
  button.danger-ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--destructive);
  }
  .danger-ghost svg {
    width: 16px;
    height: 16px;
  }
  button.quiet:hover,
  button.danger-ghost:hover {
    background: var(--accent);
  }
  button.destructive {
    color: var(--destructive-foreground);
    background: var(--destructive);
    border-color: var(--destructive);
  }
  button[hidden] {
    display: none;
  }
  #deleteConfirmation {
    max-width: 360px;
  }
  button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }
  input[type='checkbox'],
  input[type='radio'] {
    accent-color: var(--primary);
  }
  .advanced-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
    height: 32px;
    padding: 0 4px;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .advanced-toggle svg { width: 14px; height: 14px; }
  .advanced-settings { margin-top: 12px; min-height: 0; }
  .advanced-settings[hidden] { display: none; }
  .advanced-fields { max-height: 200px; overflow-y: auto; scrollbar-width: thin; padding: 2px 4px 2px 2px; }
  .environment-group + .environment-group { margin-top: 16px; }
  .environment-group h3 { margin: 0 0 8px; font-size: 12px; }
  .environment-description { margin: 0 0 8px; font-size: 12px; color: var(--muted-foreground); white-space: pre-line; overflow-wrap: anywhere; }
  .environment-field { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 1fr); align-items: center; gap: 8px; margin-top: 8px; }
  .environment-key { font: 11px var(--font-mono, monospace); overflow-wrap: anywhere; }
  .environment-field input, .environment-field textarea { width: 100%; min-width: 0; font-size: 12px; padding: 6px 8px; }
  .environment-field input { height: 32px; }
  .environment-field .search-field input { padding-right: 32px; }
  .environment-field textarea { height: 64px; resize: vertical; }
  .environment-field + .environment-description { margin-top: 4px; }
  .full {
    width: 100%;
  }
  .spaced {
    margin-top: 12px;
  }
  .modules,
  .servers {
    flex: 1;
    min-height: 0;
    overflow: auto;
    margin: 12px 0;
    scrollbar-width: thin;
  }
  .server {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--border);
  }
  .server[data-current='true'] {
    background: var(--accent);
  }
  .server-choice {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .server-copy {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  button.server-open,
  button.server-edit {
    width: 28px;
    height: 28px;
    padding: 5px;
    flex-shrink: 0;
    opacity: 0;
    border-color: transparent;
  }
  .server:hover .server-open,
  .server:focus-within .server-open,
  .server:hover .server-edit,
  .server:focus-within .server-edit {
    opacity: 1;
  }
  .server-edit svg {
    display: block;
    width: 16px;
    height: 16px;
  }
  @media (hover: none) {
    button.server-open,
    button.server-edit {
      opacity: 1;
    }
  }
  .module {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
  }
  .module[data-located='true'],
  .server[data-located='true'] {
    background: var(--accent);
    outline: 1px solid var(--ring);
    outline-offset: -1px;
  }
  .module label {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .module-name {
    overflow-wrap: anywhere;
  }
  .module small {
    white-space: nowrap;
  }
  .module button {
    font-size: 12px;
    padding: 3px 6px;
  }
  .badge {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 8px;
    font-size: 11px;
  }
  .info:empty {
    display: none;
  }
  .actions {
    margin-top: 12px;
  }
  dialog {
    max-width: 540px;
    width: 90%;
    max-height: 85vh;
    background: var(--background);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  dialog::backdrop {
    background: var(--background);
    opacity: 0.7;
  }
  dialog label {
    display: block;
    margin-top: 16px;
  }
  dialog label input {
    display: block;
    width: 100%;
    margin-top: 6px;
  }
  .right {
    margin-left: auto;
  }
  .small {
    font-size: 12px;
  }
  label {
    cursor: pointer;
  }
  @media (max-width: 700px) {
    main {
      padding: 10px;
    }
    .panels {
      gap: 8px;
    }
    .section {
      padding: 10px;
    }
    .module {
      flex-wrap: wrap;
    }
  }
</style>
<style>

  .popover-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .popover-actions .service-toggle { width: 112px; flex-shrink: 0; height: 32px; padding: 0 12px; }

  .list-toggle { color: var(--muted-foreground); }
  .picker-summary { margin: 0; padding: 4px 0; font-size: 12px; line-height: 16px; overflow: auto; scrollbar-width: thin; color: var(--muted-foreground); }
  .picker-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }

  html[data-orca-presentation] .picker-list { flex: none; }
  html[data-orca-presentation] .picker-list[hidden],
  .picker-tools[hidden] { display: none; }
  html[data-orca-presentation] .picker-list .modules { flex: 1; }
  html[data-orca-presentation] .popover-header { flex-wrap: wrap; }
  html[data-orca-presentation] .picker-tools { margin-left: auto; }
  .icon-button .loading, .search-clear .loading { animation: service-spin 1s linear infinite; }

  html[data-orca-presentation] .spaced { margin-top: 0; }

  html[data-orca-presentation] .servers { margin: 0; padding: 0 3px; }

<script>
  const $ = (id) => document.getElementById(id)
  const presentation = document.documentElement.dataset.orcaPresentation || null
  const pending = new Map()
  let sequence = 0,
    snapshot,
    selected = new Set(),
    selectedHost = '',
    busy = false,
    editingHost = null
  const searches = Object.fromEntries(['serverSearch', 'search'].map((id) =>
    [id, { query: '', pending: false, composing: false, timer: null }]))
  let panelVisible = true, statusPending = false
  const finished = new Set(['stopped', 'exited', 'failed', 'cancelled'])
  const serviceActions = new Map()
  const reportedFailures = new Set()
  const listExpanded = { bff: !presentation, fe: !presentation }
  const needsListExpansion = () => presentation && snapshot && !listExpanded[presentation] &&
    (!snapshot.runs[presentation] || finished.has(snapshot.runs[presentation].state))
  let checksPending = false, lastStatusError = ''
  let pickerFrame = 0, maxPanelHeight = 1200
  window.addEventListener('message', (event) => {
    if (event.source !== parent) return
    if (event.data?.type === 'orca-panel-height-limit' && Number.isFinite(event.data.height)) {
      if (maxPanelHeight !== event.data.height) {
        maxPanelHeight = event.data.height
        document.documentElement.style.setProperty('--picker-height-limit', `${maxPanelHeight}px`)
        schedulePickerSize()
      }
      return
    }
    if (event.data?.type === 'orca-panel-visibility' && typeof event.data.visible === 'boolean') {
      const resuming = !panelVisible && event.data.visible
      panelVisible = event.data.visible
      if (resuming) refreshStatus()
      return
    }
    if (event.data?.type !== 'orca-panel-action-result') return
    const callback = pending.get(event.data.requestId)
    if (!callback) return
    clearTimeout(callback.timer)
    pending.delete(event.data.requestId)
    event.data.ok
      ? callback.resolve(event.data.value)

        ['starting', 'waiting', 'preparing'].includes(run?.state) ||
        (run?.state === 'running' && run.health !== 'ready'))
      const symbol = icon(starting || stopping ? 'loading' : active ? 'stop' : 'play')
      symbol.classList.add('service-state-icon')
      if (starting || stopping) symbol.classList.add('loading')
      button.replaceChildren(
        symbol,
        text('span', stopping ? '停止中…' : starting ? '启动中' : active ? '停止'
          : count ? `启动（${count}）` : '启动', 'service-state-label')
      )
      const canStop = starting && active && !operation
      button.dataset.canStop = String(Boolean(canStop))
      if (canStop) {
        const stop = icon('stop')
        stop.classList.add('service-stop-icon')
        button.append(stop, text('span', '停止', 'service-stop-label'))
      }
      button.setAttribute('aria-busy', String(starting || stopping))
      button.disabled =
        busy ||
        Boolean(operation) ||
        !snapshot ||
        run?.state === 'stopping' ||
        (!active && (kind === 'bff' ? !selectedHost : !count))
      button.classList.toggle('primary', !active)
      const restart = $('restart-' + kind)
      restart.hidden = run?.state !== 'running' || run.health !== 'ready' || starting || stopping
      restart.disabled = busy || Boolean(operation)
      if (kind === 'fe') {
        $('open-fe').hidden = restart.hidden
        $('open-fe').disabled = busy || Boolean(operation)
      }
      $(kind + '-info').textContent = !presentation && run?.state === 'preparing' ? '正在准备依赖…' : ''
      if (['failed', 'pending-timeout'].includes(run?.state) && !reportedFailures.has(run.id)) {
        reportedFailures.add(run.id)
        notice(`${kind.toUpperCase()} 启动失败：${run.error || '进程已结束，请查看终端'}`)
      }
    }
    renderPicker()
  }
  $('open-fe').prepend(icon('external'))
  $('open-fe').onclick = () => action(() => request({ action: 'openFrontend', id: snapshot.runs.fe.id }))
  for (const kind of ['bff', 'fe']) {
    $('toggle-' + kind).onclick = () => {
      const run = snapshot?.runs?.[kind]
      const operation = run && !finished.has(run.state) ? 'stop' : 'start'
      const host = selectedHost
      return action(async () => {
        if (operation === 'stop') {
          await request({ action: 'stop', kind, id: run.id })
        } else {
          const draft = kind === 'bff' ? environmentDraft() : undefined
          await submitService({ action: 'start', kind, apps: [...selected],
            autoChanged, proxy: false, host, ...(kind === 'bff' ? { sshForward } : {}),
            ...(draft ? { environment: draft } : {}) })
          if (kind === 'bff') snapshot.currentHost = host
          if (kind === 'bff' && !presentation && environment) await loadEnvironment()
        }
        snapshot.runs = await request({ action: 'status' })
        if (needsListExpansion()) await load(false, true)
        notice('')
      }, kind, operation)
    }
    $('restart-' + kind).onclick = () => action(async () => {
      const draft = kind === 'bff' ? environmentDraft() : undefined
      await submitService({ action: 'restart', kind, id: snapshot.runs[kind].id,
        apps: [...selected], autoChanged, proxy: false, host: selectedHost,
        ...(kind === 'bff' ? { sshForward } : {}), ...(draft ? { environment: draft } : {}) })
      if (kind === 'bff' && !presentation && environment) await loadEnvironment()
      snapshot.runs = await request({ action: 'status' })
    }, kind, 'restart')
  }
  $('refresh').onclick = () => action(() => load(true))
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && presentation && !document.querySelector('dialog[open]'))
      parent.postMessage({ type: 'orca-panel-dismiss' }, '*')
  })

  $('product').onchange = () =>
    action(() => {
      activeLetter = ''
      locatedModule = ''
      locateAfterLoad = Boolean(presentation)
      resetSearch('search')
      return load(Boolean(presentation), true)
    })
  const selectableModules = () =>
    (snapshot?.modules || []).filter((module) => module.available && !module.isShell)
  $('selectAll').onclick = () =>
    action(async () => {
      const choices = selectableModules()
      if (choices.every((module) => selected.has(module.name))) {
        selected = new Set(entryModules())
        locatedModule = ''
        autoChanged = false
      }
      else choices.forEach((module) => selected.add(module.name))
      await save()
    })
  function editServer(server) {
    if (busy) return
    editingHost = server?.host ?? null
    const query = searches.serverSearch.query, ip = inputIp(query)
    $('serverHost').value = server?.host || ip
    $('serverName').value = server?.name ?? (ip ? '' : query)
    $('editorTitle').textContent = server ? '编辑服务器' : '添加服务器'
    $('deleteServer').hidden = !server
    renderEditorSave()
    $('editor').showModal()
    schedulePickerSize()
    $(server || !ip ? 'serverHost' : 'serverName').focus()
  }
  function inputIp(value) {
    let host = value.trim()
    try {
      if (/^https?:\/\//i.test(host)) {
        const match = host.match(/^https?:\/\/(\[[^\]]+\]|[^/:?#]+)(?::\d+)?(?:[/?#]|$)/i)
        if (!match) return ''
        host = match[1]
        new URL(value.trim())
      }
      host = host.replace(/^\[|\]$/g, '')
      if (host.includes(':')) return new URL(`http://[${host}]`).hostname.slice(1, -1)
      const parts = host.split('.')
      return parts.length === 4 && parts.every((part) =>
        /^(0|[1-9]\d{0,2})$/.test(part) && Number(part) <= 255) ? host : ''
    } catch {
      return ''
    }
  }
  function matchesSearch(value, query) {
    return value.toLowerCase().includes(query.toLowerCase())
  }
  function matchingServers(query) {
    const value = inputIp(query) || query
    return [...(snapshot?.servers || [])].reverse().filter((server) =>
      [server.host, server.name].some((field) => matchesSearch(field, value)))
      .sort((a, b) => Number(snapshot.serverChecks?.[a.host]?.available === false)
        - Number(snapshot.serverChecks?.[b.host]?.available === false))
  }
  function renderSearch(id) {
    if (id === 'search') {
      activeLetter = ''
      renderModules()
    } else renderServers()
  }
  function resetSearch(id) {
    clearTimeout(searches[id].timer)
    Object.assign(searches[id], { query: '', pending: false, composing: false })
    $(id).value = ''
    $(id + 'Clear').hidden = true
  }
  for (const id of ['serverSearch', 'search']) {
    const input = $(id), state = searches[id], clear = $(id + 'Clear')
    const update = () => {
      clearTimeout(state.timer)
      clear.hidden = !input.value
      state.pending = true
      if (!input.value && !state.composing) resetSearch(id)
      else if (!state.composing) state.timer = setTimeout(() => {
        state.query = input.value.trim()
        state.pending = false
        renderSearch(id)
      }, 300)
      renderSearch(id)
    }
    input.oninput = update
    input.addEventListener('compositionstart', () => { state.composing = true; update() })
    input.addEventListener('compositionend', () => { state.composing = false; update() })
    clear.append(icon('clear'))
    clear.onclick = () => {
      resetSearch(id)
      renderSearch(id)
      input.focus()
    }
  }
  $('serverSearch').onkeydown = (event) => {
    if (event.key !== 'Enter' || event.isComposing || searches.serverSearch.composing || busy || !snapshot) return
    event.preventDefault()
    const query = $('serverSearch').value.trim()
    clearTimeout(searches.serverSearch.timer)
    Object.assign(searches.serverSearch, { query, pending: false })
    renderServers()
    if (query && !matchingServers(query).length) editServer()
  }
  function renderEditorSave() {
    $('saveEditor').disabled = busy || !$('serverHost').value.trim() || !$('serverName').value.trim()
  }
  $('serverHost').oninput = renderEditorSave
  $('serverName').oninput = renderEditorSave
  $('closeEditor').onclick = () => $('editor').close()
  async function saveServer(remove = false) {
    try {
      const creating = editingHost === null
      const servers = snapshot.servers.filter((server) => server.host !== editingHost)
      let selectHost
      let savedHost
      if (!remove) {
        const host = $('serverHost').value.trim()
        const value = { host, name: $('serverName').value.trim() }
        const index = snapshot.servers.findIndex((server) => server.host === editingHost)
        servers.splice(index < 0 ? servers.length : index, 0, value)
        savedHost = inputIp(host) || host.toLowerCase()
        if (creating || editingHost === selectedHost) selectHost = savedHost
      }
      await request({ action: 'saveServers', servers, ...(selectHost ? { selectHost } : {}) })
      if (!remove) {
        resetSearch('serverSearch')
        locatedHost = savedHost
        locateAfterLoad = false
      }
      $('deleteConfirmation').close()
      $('editor').close()
      await load(false, true)
      if (!remove) requestAnimationFrame(() => centerListItem($('servers'),
        [...$('servers').querySelectorAll('.server')].find((item) => item.dataset.host === savedHost)))
      notice('')
    } catch (error) {
      notice(error.message)
    }
  }
  $('saveEditor').onclick = () => {
    if ($('serverHost').reportValidity() && $('serverName').reportValidity())
      action(() => saveServer())
  }
  $('serverForm').onkeydown = (event) => {
    if (event.key === 'Enter' && !event.isComposing && event.target.tagName === 'INPUT') {
      event.preventDefault()
      $('saveEditor').click()
    }
  }
  $('deleteServer').prepend(icon('trash'))
  $('deleteServer').onclick = () => {
    $('deleteConfirmation').showModal()
    schedulePickerSize()
    $('cancelDelete').focus()
  }
  $('cancelDelete').onclick = () => $('deleteConfirmation').close()
  $('confirmDelete').onclick = () => action(() => saveServer(true))
  for (const id of ['editor', 'deleteConfirmation']) {
    $(id).addEventListener('cancel', (event) => { if (busy) event.preventDefault() })
    $(id).addEventListener('close', schedulePickerSize)
  }
  function renderServerCheck() {
    const button = $('checkServers'), checking = snapshot?.checkingServers
    button.disabled = Boolean(checking || checksPending)
    button.setAttribute('aria-busy', String(Boolean(checking)))
    button.title = checking ? '正在检测服务器' : '重新检测服务器'
    const symbol = icon(checking ? 'loading' : 'refresh')
    if (checking) symbol.classList.add('loading')
    button.replaceChildren(symbol)
  }
  async function checkServers(refresh = false) {
    if (!snapshot || !listExpanded.bff || checksPending) return
    checksPending = true
    renderServerCheck()
    try {
      Object.assign(snapshot, await request({ action: refresh ? 'checkServers' : 'serverChecks' }))
      renderServers()
    } catch (error) { notice(error.message) }
    finally { checksPending = false; renderServerCheck() }
  }
  $('checkServers').onclick = () => checkServers(true)
  setInterval(() => {
    if (panelVisible && !document.hidden && snapshot?.checkingServers) void checkServers()
  }, 1000)
  function renderPicker() {
    if (!presentation || !$('listToggle')) return
    const expanded = listExpanded[presentation]
    const configuring = presentation === 'bff' && !$('bff-advanced').hidden
    const run = snapshot?.runs?.[presentation]
    const active = run && !finished.has(run.state)
    const list = presentation === 'bff' ? $('servers') : $('moduleBrowser')
    list.hidden = !expanded || configuring
    $(presentation + '-section').querySelector('.picker-tools').hidden = !expanded || configuring
    $('product').hidden = presentation === 'fe' && !expanded
    const toggle = $('listToggle')
    toggle.hidden = !active || configuring
    toggle.disabled = busy || !snapshot
    toggle.setAttribute('aria-expanded', String(expanded))
    toggle.title = expanded ? '收起列表' : '展开列表'
    toggle.setAttribute('aria-label', toggle.title)
    toggle.replaceChildren(icon(expanded ? 'up' : 'down'))
    const summary = $('pickerSummary')
    const scrollTop = summary.scrollTop
    summary.hidden = expanded || configuring
    summary.replaceChildren()
    if (active) {
      const values = presentation === 'bff' ? run.host ? [run.host] : [] : run.apps || []
      if (values.length) {
        const tags = text('ul', '', 'picker-tags')
        tags.setAttribute('aria-label', presentation === 'bff' ? '后端服务器' : '启动模块')
        tags.append(...values.map((value) => text('li', value, 'badge')))
        summary.append(tags)
      }
    } else if (!snapshot && busy) summary.textContent = '正在读取启动状态…'
    summary.scrollTop = scrollTop
    schedulePickerSize()
  }
  function schedulePickerSize() {
    if (!presentation || pickerFrame) return
    pickerFrame = requestAnimationFrame(() => {
      pickerFrame = 0
      const list = presentation === 'bff' ? $('servers') : $('moduleBrowser')
      if (!list) return
      const configuring = presentation === 'bff' && !$('bff-advanced').hidden
      const content = configuring ? $('bff-environment-fields') : list.hidden ? $('pickerSummary') : list
      const viewport = list.hidden || presentation === 'bff' ? content : $('modules')
      const scrollTop = viewport.scrollTop
      const main = document.querySelector('main')
      content.style.height = 'auto'
      const natural = content.getBoundingClientRect().height
      const chrome = main.getBoundingClientRect().height - natural
      content.style.height = presentation === 'bff' && (configuring || !list.hidden)
        ? Math.max(40, Math.min(400, maxPanelHeight - chrome)) + 'px'
        : Math.max(list.hidden ? 0 : 40, Math.min(natural, 400, maxPanelHeight - chrome)) + 'px'
      viewport.scrollTop = scrollTop
      const dialogs = [...document.querySelectorAll('dialog[open]')]
      const height = Math.max(main.getBoundingClientRect().height,
        ...dialogs.map((dialog) => dialog.scrollHeight + 34))
      parent.postMessage({ type: 'orca-panel-height', height: Math.ceil(Math.min(height, maxPanelHeight)) }, '*')
    })
  }
  window.addEventListener('resize', schedulePickerSize)
  function refreshStatus() {
    if (!snapshot || busy || !panelVisible || document.hidden || statusPending) return
    statusPending = true
    request({ action: 'status' })
      .then((runs) => {
        const completed = Object.entries(runs).some(
          ([kind, run]) =>
            run?.operation === 'install' &&
            finished.has(run.state) &&
            snapshot.runs[kind] &&
            !finished.has(snapshot.runs[kind].state)
        )
        snapshot.runs = runs
        lastStatusError = ''
        renderRuns()
        if (completed || needsListExpansion()) action(() => load(true, true))
      })
      .catch((error) => {
        if (lastStatusError !== error.message) notice(error.message)
        lastStatusError = error.message
      })
      .finally(() => { statusPending = false })
  }
  setInterval(refreshStatus, 4000)
  if (presentation) {
    const section = $(presentation + '-section')
    const header = section.querySelector('.toolbar')
    header.classList.add('popover-header')
    const tools = text('div', '', 'picker-tools')
    if (presentation === 'fe') tools.append($('selectAll'), $('locateSelected'))
    else tools.append($('locateServer'), $('checkServers'))
    tools.append($(presentation === 'bff' ? 'serverSearch' : 'search').closest('.search-field'))
    header.append(tools)
    const summary = text('div', '', 'picker-summary')
    summary.id = 'pickerSummary'
    header.after(summary)
    const list = presentation === 'bff' ? $('servers') : $('modules').parentElement
    list.classList.add('picker-list')
    list.id = presentation === 'bff' ? 'servers' : 'moduleBrowser'
    const footer = text('div', '', 'popover-footer')
    const controls = text('div', '', 'popover-actions')
    const toggle = text('button', '', 'quiet icon-button list-toggle')
    toggle.id = 'listToggle'
    toggle.setAttribute('aria-controls', list.id)
    toggle.onclick = () => {
      if (listExpanded[presentation]) {
        listExpanded[presentation] = false
        $(presentation === 'bff' ? 'servers' : 'modules').replaceChildren()
        renderPicker()
      } else {
        locateAfterLoad = true
        action(() => load(true, true))
      }
    }
    if (presentation === 'bff') controls.append($('advanced-bff'))
    controls.append(toggle)
    if (presentation === 'fe') controls.append($('product'))
    const actions = text('div', '', 'service-actions')
    if (presentation === 'fe') actions.append($('open-fe'))
    actions.append($('restart-' + presentation), $('toggle-' + presentation))
    controls.append(actions)
    footer.append($(presentation + '-info'), controls)
    section.append(footer)
    section.querySelector('.product-controls').remove()
    const emptyRow = header.querySelector('.row')
    if (emptyRow && !emptyRow.children.length) emptyRow.remove()
    renderPicker()
  }
  action(() => load(Boolean(presentation)))
</script>
